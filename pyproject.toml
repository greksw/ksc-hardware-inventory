[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ksc-hardware-inventory"
version = "0.2.0"
description = "Single-host KSC Open API RAM module inventory and secure SSH ingest"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["ksc_inventory*"]
